<style>
:root{--navy:#07172e;--gold:#d3ad62;--lightgold:#f1d99d;--cream:#f8f6f1;--text:#283343;--muted:#737d89;--line:#e9e5dc}
*{box-sizing:border-box}body{margin:0;font-family:'DM Sans',sans-serif;color:var(--text);line-height:1.65}a{text-decoration:none;color:inherit}.container{width:min(1120px,92%);margin:auto}.topline{height:4px;background:linear-gradient(90deg,var(--navy),var(--gold),var(--navy))}header{position:sticky;top:0;background:#fff;z-index:5;box-shadow:0 3px 15px #00000012}.nav{min-height:120px;display:flex;align-items:center;justify-content:space-between;gap:18px}.brand img{width:180px;height:115px;object-fit:contain;display:block}nav{display:flex;gap:15px;align-items:center;flex-wrap:wrap}nav a{font-size:10px;font-weight:700;color:var(--navy)}.contact-link{background:var(--navy);color:white;padding:10px 13px}.content{padding:42px 0 70px}.back{display:inline-block;color:#98712d;font-weight:700;font-size:12px;margin-bottom:22px}.layout{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(280px,.8fr);gap:34px;align-items:start}.gallery{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.gallery img{width:100%;height:230px;object-fit:cover;background:var(--cream);cursor:pointer}.gallery img:first-child{grid-column:1/-1;height:440px}.no-image{background:var(--cream);height:300px;display:grid;place-items:center;color:var(--muted)}.details h1{font:600 clamp(30px,4vw,44px)/1.15 'Playfair Display',serif;color:var(--navy);margin:10px 0}.eyebrow{font-size:11px;letter-spacing:2px;color:#98712d;font-weight:700;text-transform:uppercase}.meta{color:var(--muted);font-size:14px}.price{font-size:25px;font-weight:700;color:#98712d;margin:18px 0}.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:22px 0}.fact{background:var(--cream);padding:13px;border:1px solid var(--line)}.fact strong{display:block;color:var(--navy);font-size:18px}.fact span{font-size:11px;color:var(--muted)}.panel{border:1px solid var(--line);padding:22px;margin-top:20px}.panel h2{font:600 24px 'Playfair Display',serif;color:var(--navy);margin:0 0 12px}.description{white-space:pre-line;color:#4c5663}.features{display:flex;flex-wrap:wrap;gap:8px;padding:0;list-style:none}.features li{background:var(--cream);padding:7px 11px;font-size:12px}.btn{display:inline-block;background:var(--gold);color:var(--navy);padding:13px 19px;font-weight:700;font-size:12px;margin-top:12px}.notice{text-align:center;padding:55px 20px;background:var(--cream);border:1px solid var(--line)}footer{background:#041124;color:#c5ced9;padding:28px 0;text-align:center;font-size:12px}footer a{color:var(--lightgold)}@media(max-width:800px){.layout{grid-template-columns:1fr}.gallery img:first-child{height:330px}.gallery img{height:170px}.nav{align-items:flex-start;flex-direction:column;padding:10px 0}nav{gap:10px}}@media(max-width:520px){.gallery img:first-child{height:260px}.facts{grid-template-columns:repeat(3,1fr)}.brand img{width:145px;height:95px}}

/* PPS18 premium property detail layout */
header{box-shadow:0 8px 24px #07172e12}
.nav{min-height:132px;justify-content:center;position:relative}
.brand{display:flex;align-items:center;justify-content:center}
.brand img{width:340px;height:126px;object-fit:contain}
.menu{display:none;border:1px solid #d9c18e;background:#fff;color:var(--navy);width:44px;height:42px;font-size:25px;cursor:pointer}
.navbar{background:var(--navy);border-top:1px solid #ffffff14}
.navbar nav{min-height:54px;display:flex;gap:clamp(8px,1.2vw,16px);align-items:center;justify-content:space-between;flex-wrap:nowrap}
.navbar nav a{position:relative;display:inline-flex;align-items:center;min-height:54px;font-size:9px;font-weight:700;letter-spacing:.45px;color:#f7f4ed;white-space:nowrap}
.navbar nav a:after{content:"";position:absolute;left:0;right:0;bottom:10px;height:2px;background:var(--gold);transform:scaleX(0);transform-origin:left;transition:transform .2s}
.navbar nav a:hover:after{transform:scaleX(1)}
.navbar nav .contact-link{background:var(--gold);color:var(--navy);padding:0 14px;min-height:34px}
.navbar nav .contact-link:after{display:none}
.content{padding:34px 0 76px}
.back{display:inline-flex;align-items:center;gap:8px;padding:10px 0;margin-bottom:22px;letter-spacing:.7px}
.layout{grid-template-columns:minmax(0,1.55fr) minmax(300px,.75fr);gap:38px}
.gallery{gap:12px}
.gallery img{height:220px;transition:filter .2s}
.gallery img:hover{filter:brightness(.94)}
.gallery img:first-child{height:470px}
.details{position:sticky;top:180px}
.details h1{font-size:clamp(32px,3.4vw,46px);letter-spacing:-.5px}
.price{font-size:29px}
.facts{gap:9px}
.fact{padding:15px 12px}
.panel{padding:25px;margin-top:24px}
.panel h2{font-size:25px}
.details .panel{background:#fff;box-shadow:0 12px 34px #07172e0d;border-top:3px solid var(--gold)}
.details .btn{display:block;text-align:center;padding:15px 16px}
.details .whatsapp{display:block;text-align:center;border:1px solid #d9c18e;color:var(--navy);padding:13px 16px;margin-top:10px;font-size:12px;font-weight:700}
.no-image{min-height:360px}
@media(max-width:900px){.layout{grid-template-columns:1fr}.details{position:static}.gallery img:first-child{height:390px}.gallery img{height:190px}}
@media(max-width:760px){
 .nav{min-height:110px;justify-content:center}
 .brand img{width:250px;height:94px}
 .menu{display:block;position:absolute;right:0;top:50%;transform:translateY(-50%)}
 .navbar nav{display:none;min-height:0;padding:10px 0 16px;flex-direction:column;align-items:stretch;gap:0}
 .navbar nav.open{display:flex}
 .navbar nav a{min-height:0;padding:13px 8px;border-bottom:1px solid #ffffff18;font-size:11px;letter-spacing:1px}
 .navbar nav a:after{display:none}
 .navbar nav .contact-link{text-align:center;justify-content:center;margin-top:12px;padding:12px}
 .content{padding:25px 0 52px}
 .gallery img:first-child{height:300px}
 .gallery img{height:155px}
 .layout{gap:18px}
 .details h1{font-size:34px}
 .price{font-size:26px}
 .panel{padding:20px;margin-top:18px}
}
@media(max-width:460px){.gallery{gap:7px}.gallery img:first-child{height:250px}.gallery img{height:120px}.facts{grid-template-columns:repeat(3,minmax(0,1fr))}.fact{padding:10px 8px}.fact strong{font-size:16px}.fact span{font-size:10px}}

.details .enquiry-note{font-size:11px;color:var(--muted);text-align:center;margin:14px 0 0;line-height:1.7}.details .panel>p.meta{line-height:1.7}
.notice .eyebrow{display:block;margin-bottom:12px}.notice .back-link{display:inline-block;margin:14px 0 0 16px;color:var(--navy);font-size:11px;font-weight:700;letter-spacing:.5px}@media(max-width:760px){.notice{padding:28px 20px!important}.notice h2{font-size:28px}.notice .back-link{display:block;margin:16px 0 0}}
/* SHARED PPS18 SITE HEADER — consistent across every page */
header{position:sticky;top:0;z-index:100;background:#fff;box-shadow:0 8px 24px #07172e12}
.topline{height:4px;background:linear-gradient(90deg,#07172e 0%,#d3ad62 48%,#07172e 100%)}
.nav{min-height:132px;display:flex;align-items:center;justify-content:center;gap:20px;position:relative}
.brand{display:flex;align-items:center;justify-content:center;gap:10px;margin:0;flex:0 0 auto}
.brand img,.brand .pps18-header-logo{width:340px;height:126px;object-fit:contain;flex:0 0 auto}
.menu{display:none;border:1px solid #d9c18e;background:#fff;color:#07172e;width:44px;height:42px;font-size:25px;cursor:pointer}
.navbar{background:#07172e;border-top:1px solid #ffffff14}
.navbar nav{min-height:54px;display:flex;gap:clamp(10px,1.45vw,20px);align-items:center;justify-content:space-between}
.navbar nav a{position:relative;display:inline-flex;align-items:center;min-height:54px;font-size:10px;font-weight:700;letter-spacing:.65px;color:#f7f4ed;white-space:nowrap;transition:color .2s}
.navbar nav a:after{content:"";position:absolute;left:0;right:0;bottom:10px;height:2px;background:#d3ad62;transform:scaleX(0);transform-origin:left;transition:transform .2s}
.navbar nav a:hover{color:#f1d99d}.navbar nav a:hover:after{transform:scaleX(1)}
.navbar nav .contact-link{background:#d3ad62;color:#07172e;padding:0 17px;min-height:34px;letter-spacing:1px}
.navbar nav .contact-link:after{display:none}.navbar nav .contact-link:hover{background:#f1d99d;color:#07172e}
@media(max-width:1100px){.nav{min-height:112px}.brand img,.brand .pps18-header-logo{width:290px;height:106px}.navbar nav{gap:10px}.navbar nav a{font-size:9px;letter-spacing:.35px}}
@media(max-width:760px){.nav{min-height:100px}.brand img,.brand .pps18-header-logo{width:250px;height:94px}.menu{display:block;border-radius:2px;position:absolute;right:0;top:50%;transform:translateY(-50%)}.navbar{display:none}.navbar nav{display:flex;position:static;min-height:0;padding:10px 0 16px;flex-direction:column;align-items:stretch;gap:0;box-shadow:none}.navbar nav.open{display:flex}.navbar nav a{min-height:0;padding:13px 8px;border-bottom:1px solid #ffffff18;font-size:11px;letter-spacing:1px}.navbar nav a:after{display:none}.navbar nav .contact-link{text-align:center;justify-content:center;margin-top:12px;padding:12px}}

/* Mobile menu visibility: reveal the full-width bar when the menu is opened */
@media(max-width:760px){.navbar:has(nav.open){display:block!important}}
</style>
</head>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(async function(){
 const root=document.getElementById('propertyContent');
 const client=window.supabase.createClient('https://mlyyfxywfrrsyzehveuq.supabase.co','sb_publishable_pBCFrxcZMYEswJxTpl885g_a4yvzaAr');
 const esc=v=>String(v??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
 const id=new URLSearchParams(window.location.search).get('id');
 if(!id){root.innerHTML='<div class="notice"><span class="eyebrow">PPS18 PROPERTY COLLECTION</span><h2>Explore Available Properties</h2><p>Choose a property from our current listings to view its photographs, price, features and full details. If you cannot find what you are looking for, our team will be happy to help.</p><a class="btn" href="listings.html">BROWSE PROPERTY LISTINGS</a><a class="back-link" href="index.html">RETURN TO HOMEPAGE</a></div>';return;}
 try{
  const {data:p,error}=await client.from('properties').select('id,title,category,listing_type,location,area,price,price_currency,bedrooms,bathrooms,size_sqm,description,features,cover_image,image_urls,status').eq('id',id).eq('status','published').maybeSingle();
  if(error) throw error;
  if(!p){root.innerHTML='<div class="notice"><h2>Property not available</h2><p>This property may have been removed or is no longer being advertised.</p><a class="btn" href="listings.html">VIEW OTHER PROPERTIES</a></div>';return;}
  const photos=[...new Set([p.cover_image,...(p.image_urls||[])].filter(Boolean))];
  const gallery=photos.length?'<div class="gallery">'+photos.map((url,i)=>'<img loading="'+(i===0?'eager':'lazy')+'" src="'+esc(url)+'" alt="'+esc(p.title)+' photograph '+(i+1)+'">').join('')+'</div>':'<div class="no-image">Photographs coming soon</div>';
  const price=p.price==null?'Price on request':new Intl.NumberFormat('en-US',{style:'currency',currency:p.price_currency||'THB',maximumFractionDigits:0}).format(Number(p.price));
  const fact=(value,label)=>value==null?'':'<div class="fact"><strong>'+esc(value)+'</strong><span>'+label+'</span></div>';
  const features=(p.features||[]).length?'<section class="panel"><h2>Property features</h2><ul class="features">'+p.features.map(f=>'<li>'+esc(f)+'</li>').join('')+'</ul></section>':'';
  const subject=encodeURIComponent('Property enquiry: '+p.title+' | PPS18 Ref: '+p.id);
  const emailBody=encodeURIComponent('Hello PPS18 Property Group,\n\nI am interested in this property:\nProperty: '+p.title+'\nReference: '+p.id+'\nLocation: '+[p.area,p.location].filter(Boolean).join(', ')+'\nListing: '+p.listing_type+'\n\nMy name: \nMy phone / WhatsApp: \nPreferred viewing date: \nMy message: \n\nThank you.');
  const whatsappText=encodeURIComponent('Hello PPS18, I am interested in '+p.title+'. Property reference: '+p.id+'. Please could you send me more information?');
  root.innerHTML='<div class="layout"><div>'+gallery+'<section class="panel"><h2>Description</h2><div class="description">'+esc(p.description)+'</div></section>'+features+'</div><aside class="details"><div class="eyebrow">'+esc(p.category)+' · '+esc(p.listing_type)+'</div><h1>'+esc(p.title)+'</h1><div class="meta">'+esc([p.area,p.location].filter(Boolean).join(', '))+'</div><div class="price">'+esc(price)+'</div><div class="facts">'+fact(p.bedrooms,'Bedrooms')+fact(p.bathrooms,'Bathrooms')+fact(p.size_sqm!=null?p.size_sqm+' m²':null,'Floor area')+'</div><section class="panel"><h2>Interested in this property?</h2><p class="meta">Contact PPS18 Property Group for further information or to arrange a viewing. Your enquiry will include this property’s title and reference, so our team knows exactly which listing you mean.</p><a class="btn" href="mailto:info@pps18propertygroup.com?subject='+subject+'&body='+emailBody+'">EMAIL US ABOUT THIS PROPERTY</a><a class="whatsapp" target="_blank" rel="noopener" href="https://wa.me/66987373938?text='+whatsappText+'">ENQUIRE ON WHATSAPP</a><p class="enquiry-note">PPS18 Property Group · +66 98-737-3938 · info@pps18propertygroup.com</p></section></aside></div>';
 }catch(err){root.innerHTML='<div class="notice"><h2>Unable to load this property</h2><p>Please try again shortly or contact PPS18 Property Group.</p><a class="btn" href="mailto:info@pps18propertygroup.com">CONTACT PPS18</a></div>';console.error(err);}
})();
</script>
